[package]
name = "nok-codegen"
version = "0.0.1"
authors = ["seavaux <seavaux@seavaux.com>"]
keywords = ["error", "error-handling"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/seavaux/nok-codegen"
edition = "2021"

[lib]
proc-macro=true

[dependencies]
proc-macro2 = "1.0.69"
quote = "1.0"
syn = { version = "2.0.104", features = ["extra-traits"] }

[dev-dependencies]
prettyplease = "0.2.36"
